<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PatientMap — BEFAST Stroke Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar">
    <div id="brand">
      <span class="brand-pulse"></span>
      <h1>PatientMap</h1>
      <span class="brand-sub">BEFAST Assessment</span>
    </div>

    <div id="topbar-hint">Tap a node · drag highlighted phrases into the chart</div>

    <button id="stroke-alert-btn" type="button">
      <span class="alert-icon">⚠</span> STROKE ALERT
    </button>
  </header>

  <main id="layout">
    <section id="map-wrap">
      <svg id="map" role="img" aria-label="Patient assessment node map"></svg>
      <div id="map-hint">drag to pan · scroll to zoom · tap a node to act</div>

      <!-- conversation overlay lives inside the map area -->
      <div id="stage" class="hidden">
        <img id="stage-figure" alt="Patient" />
        <div id="convo">
          <button id="convo-close" type="button" aria-label="Close">✕</button>
          <div id="convo-body"></div>
        </div>
      </div>
    </section>

    <aside id="panel">
      <h2 class="panel-title">Patient History &amp; Notes</h2>

      <div id="patient-card">
        <img id="patient-thumb" alt="" />
        <div class="patient-meta">
          <span class="meta-label">NAME</span>
          <div class="meta-value" id="patient-name"></div>
          <span class="meta-label">D.O.B.</span>
          <div class="meta-value" id="patient-dob"></div>
        </div>
      </div>

      <div id="befast-board"></div>

      <div id="trash-zone" class="drop-zone trash" data-zone="TRASH">
        <span class="trash-icon">🗑</span>
        <div class="trash-body">
          <div class="trash-title">Distractors</div>
          <div class="zone-chips"></div>
        </div>
      </div>
    </aside>
  </main>

  <div id="modal-backdrop" class="hidden">
    <div id="modal" role="dialog" aria-modal="true">
      <div id="modal-content"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <div id="drag-ghost" class="hidden"></div>

  <script src="js/case-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
