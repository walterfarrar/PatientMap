<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PatientMap — BEFAST Stroke Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar">
    <div id="brand">
      <span class="brand-pulse"></span>
      <h1>PatientMap</h1>
      <span class="brand-sub">BEFAST Assessment</span>
    </div>

    <div id="befast-tracker" aria-label="BEFAST evidence tracker"></div>

    <button id="stroke-alert-btn" type="button">
      <span class="alert-icon">⚠</span> STROKE ALERT
    </button>
  </header>

  <main id="layout">
    <section id="map-wrap">
      <svg id="map" role="img" aria-label="Patient assessment node map"></svg>
      <div id="map-hint">drag to pan · scroll to zoom · tap a node to act</div>
    </section>

    <aside id="panel">
      <nav id="panel-tabs">
        <button class="tab active" data-tab="interaction">Interaction</button>
        <button class="tab" data-tab="data">Collected Data <span id="data-count"></span></button>
      </nav>

      <div id="tab-interaction" class="tab-page active">
        <div id="interaction-content">
          <p class="placeholder">Select a node on the map to begin the assessment.</p>
        </div>
      </div>

      <div id="tab-data" class="tab-page">
        <p class="panel-help">Tag each clinical finding to the BEFAST category it supports. Supporting data is filed automatically.</p>
        <h3 class="data-heading">Untagged Findings</h3>
        <div id="findings-untagged"></div>
        <h3 class="data-heading">Tagged Evidence</h3>
        <div id="findings-tagged"></div>
        <h3 class="data-heading">Supporting Data</h3>
        <div id="findings-supporting"></div>
      </div>
    </aside>
  </main>

  <div id="modal-backdrop" class="hidden">
    <div id="modal" role="dialog" aria-modal="true">
      <div id="modal-content"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="js/case-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
